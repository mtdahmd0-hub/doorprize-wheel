<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Doorprize · Customer Gathering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,500..800;1,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-0:#0b3f91;--sky-1:#1a63c7;--sky-2:#3d95e6;--sky-3:#8fd0f5;
  --navy:#08245a;--navy-2:#0d3577;--panel:rgba(7,38,96,.84);
  --volt:#ffc928;--volt-2:#f5a623;--ember:#f28c28;--cyan:#7fdcff;
  --white:#ffffff;--soft:#cfe6ff;--alert:#c62828;
  --rule:rgba(255,255,255,.22);
  --display:"Anton","Impact",sans-serif;
  --ui:"Montserrat","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--white);font-family:var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(40% 30% at 12% 18%,rgba(255,255,255,.35),transparent 70%),
    radial-gradient(35% 26% at 88% 22%,rgba(255,255,255,.3),transparent 70%),
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 48%,var(--sky-3) 100%) fixed;
  background-color:var(--sky-2)}
::selection{background:var(--volt);color:var(--navy)}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
*{scrollbar-color:rgba(255,255,255,.4) transparent;scrollbar-width:thin}

/* horizon: skyline of the energy landscape + the blue-to-gold sweep from the backdrop */
.horizon{position:fixed;left:0;right:0;bottom:0;height:min(30vh,300px);z-index:0;pointer-events:none}
.horizon svg{position:absolute;inset:0;width:100%;height:100%}

.stage{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:clamp(24px,4vw,64px);align-items:center;min-height:100dvh;max-width:1680px;margin:0 auto;padding:clamp(16px,3vw,44px)}
.stage.surge{animation:surge .6s cubic-bezier(.36,.07,.19,.97) both}
.wheel{position:relative;width:min(100%,84dvh);aspect-ratio:1;margin:5% auto 0}
#c{position:relative;display:block;width:100%;height:100%;filter:drop-shadow(0 26px 40px rgba(4,30,80,.5))}
/* stage spotlights sweeping slowly behind the wheel */
.beams{position:absolute;inset:-28%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,244,200,.16) 0deg 5deg,transparent 5deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 32%,transparent 70%);mask:radial-gradient(circle,#000 32%,transparent 70%);
  animation:sweep 48s linear infinite}
@keyframes sweep{to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.beams{animation:none}}
.pin{position:absolute;left:50%;top:-6.5%;width:8.6%;translate:-50% 0;transform-origin:50% 28%;filter:drop-shadow(0 6px 8px rgba(4,30,80,.5));z-index:2}

.panel{display:flex;flex-direction:column;gap:clamp(14px,2vh,22px);min-width:0;background:var(--panel);border-radius:18px;padding:clamp(20px,2.4vw,32px);box-shadow:0 24px 60px -20px rgba(4,24,70,.7)}
.event{margin:0;font-family:var(--display);font-size:clamp(1.15rem,1.7vw,1.6rem);line-height:1.05;letter-spacing:.01em;color:var(--soft);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,6vw,6rem);line-height:.9;letter-spacing:.005em;text-transform:uppercase;text-shadow:0 6px 22px rgba(3,24,70,.55)}
.tag{margin:-4px 0 0;font-weight:700;font-style:italic;font-size:clamp(.95rem,1.25vw,1.15rem)}
.tag .a{color:var(--cyan)}.tag .b{color:var(--volt)}
.sweep{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--sky-2),var(--cyan) 45%,var(--volt) 75%,var(--ember))}
.serial{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.serial small{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.serial b{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,3.2vw,3rem);color:var(--volt);line-height:1;font-variant-numeric:tabular-nums}
.mode{margin:0;padding:11px 14px;border-radius:12px;font-weight:600;font-size:.98rem;line-height:1.35;border:1px solid var(--rule);color:var(--soft)}
.mode.preset{order:99;padding:10px 0 0;border:0;border-top:1px solid var(--rule);border-radius:0;background:none;color:var(--soft);font-weight:500;font-style:italic;font-size:.95rem}
.mode[hidden]{display:none}
.spin{appearance:none;border:0;cursor:pointer;width:100%;padding:20px 24px;border-radius:14px;background:linear-gradient(180deg,#ffd95a,var(--volt) 55%,var(--volt-2));color:var(--navy);font-family:var(--display);font-size:1.7rem;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 26px -8px rgba(3,20,60,.7);transition:filter .2s,transform .12s,opacity .2s}
.spin:hover{filter:brightness(1.06)}
.spin:active{transform:translateY(2px)}
.spin:focus-visible{outline:3px solid var(--white);outline-offset:4px}
.spin:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.hint{margin:-8px 0 0;text-align:center;color:var(--soft);font-size:.82rem}
.hint kbd{font-family:var(--ui);font-weight:700;font-size:.72rem;border:1px solid var(--rule);border-radius:6px;padding:1px 7px;color:var(--white)}
.ledger h2{margin:0 0 6px;font-size:.78rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.ledger ol{list-style:none;margin:0;padding:0;max-height:min(24vh,220px);overflow:auto}
.ledger li{display:flex;align-items:baseline;gap:10px;padding:6px 0}
.ledger li .no{font-size:.8rem;font-weight:700;color:var(--volt);font-variant-numeric:tabular-nums;flex:none}
.ledger li .dots{flex:1;border-bottom:1px dotted rgba(255,255,255,.35);translate:0 -4px;min-width:20px}
.ledger li .nm{font-weight:700;font-size:1.1rem;text-align:right;overflow-wrap:anywhere}
.ledger .empty{color:var(--soft);font-style:italic;padding:4px 0}
.count{margin:0;color:var(--soft);font-size:.86rem}
.place{margin:0;font-size:.82rem;font-weight:600;color:var(--soft)}

/* reveal */
.reveal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(26,99,199,.92),rgba(6,30,78,.96) 72%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s ease-out both}
.reveal[hidden]{display:none}
.ring{position:absolute;left:50%;top:46%;width:56vmin;aspect-ratio:1;border-radius:50%;border:3px solid var(--volt);translate:-50% -50%;opacity:0;animation:pulse 2.2s cubic-bezier(.16,1,.3,1) both}
.ring:nth-child(2){animation-delay:.3s;border-color:var(--cyan)}
.ring:nth-child(3){animation-delay:.6s;border-color:var(--ember)}
.ring:nth-child(4){animation-delay:.9s;border-color:var(--white)}
.reveal .rsweep{position:absolute;left:0;right:0;bottom:0;height:28vh;pointer-events:none}
.win{position:relative;text-align:center;max-width:min(100%,1150px)}
.badge{width:clamp(92px,11vmin,124px);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;display:grid;place-content:center;color:var(--navy);background:radial-gradient(circle at 35% 30%,#fff3b8 0 8%,var(--volt) 40%,var(--volt-2) 100%);box-shadow:0 0 0 6px rgba(255,201,40,.25),0 16px 30px rgba(3,20,60,.55);animation:pop .6s cubic-bezier(.2,1.5,.35,1) .1s both}
.badge small{font:800 .7rem var(--ui);letter-spacing:.2em}
.badge b{font:400 2.3rem/1 var(--display)}
.win-lead{margin:0;font-size:clamp(.9rem,1.5vw,1.15rem);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
/* room-readable on a projector: deliberately above the 6rem display ceiling */
.win-name{margin:.08em 0 .06em;font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,10vw,8.6rem);line-height:1;text-transform:uppercase;color:var(--white);overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 8px 30px rgba(2,18,56,.65);animation:pop .7s cubic-bezier(.2,1.5,.35,1) .3s both}
.win-sub{margin:0;font-weight:700;font-style:italic;font-size:clamp(1.1rem,2.2vw,1.8rem);color:var(--volt)}
.win-note{margin:16px auto 0;max-width:44ch;font-size:.95rem;font-weight:500;font-style:italic;color:var(--soft)}
.win-note[hidden]{display:none}
.win-tag{margin:clamp(18px,3vh,30px) 0 0;font-weight:700;font-style:italic;font-size:clamp(.9rem,1.4vw,1.1rem)}
.win-tag .a{color:var(--cyan)}.win-tag .b{color:var(--volt)}
.next{margin-top:clamp(18px,3vh,30px);appearance:none;cursor:pointer;background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.7);border-radius:12px;padding:11px 30px;font:800 1rem var(--ui);letter-spacing:.14em;text-transform:uppercase;transition:background .2s,color .2s,border-color .2s}
.next:hover{background:var(--volt);border-color:var(--volt);color:var(--navy)}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(2.8)}}
@keyframes pop{0%{opacity:0;transform:scale(1.35);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}
@keyframes surge{10%,90%{translate:-1px 0}20%,80%{translate:3px 0}30%,50%,70%{translate:-4px 0}40%,60%{translate:4px 0}}

@media (max-width:900px){
  .stage{grid-template-columns:1fr;align-items:start;padding-top:52px;padding-bottom:120px}
  .wheel{width:min(100%,560px)}
}
@media (prefers-reduced-motion:reduce){
  .win-name,.badge,.reveal,.stage.surge{animation:none}
  .ring{display:none}
}
</style>
</head>
<body>
<!--
THESIS: the doorprize wheel belongs to the Customer Gathering stage (no host company name on screen): the same sky, the same white condensed headline, the same blue-to-gold energy sweep; the wheel lights up like a stage ring and the winner lands with an energy pulse. Refuses a generic casino wheel that ignores the event.
OWN-WORLD: sky-blue gradient ground with soft cloud light, skyline of plant chimneys, turbines and transmission towers, blue-cyan-gold-orange sweep; wheel in event blues, volt yellow, orange and teal with flowing energy lines and chasing rim lights; Anton headlines, Montserrat text.
STORY: guests recognise their event, see the draw number and names, watch the wheel spin, read the winner from the back of the room; preset mode is always disclosed.
FIRST VIEWPORT: wheel at ~84vh left under a yellow pin; right: event panel with title, tagline, draw serial, mode band, yellow spin button, numbered winners.
FORM: brand-pinned by the user's stage backdrop (overrides the earlier roll, seed 5aceaf5b).
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<div class="horizon" aria-hidden="true">
  <svg viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
    <defs>
      <linearGradient id="sw1" x1="0" x2="1"><stop offset="0" stop-color="#1a63c7"/><stop offset=".45" stop-color="#4fb8f0"/><stop offset=".72" stop-color="#ffd95a"/><stop offset="1" stop-color="#f28c28"/></linearGradient>
      <linearGradient id="sw2" x1="0" x2="1"><stop offset="0" stop-color="#0b3f91"/><stop offset=".6" stop-color="#1a63c7"/><stop offset="1" stop-color="#3d95e6"/></linearGradient>
    </defs>
    <g fill="#bfe2fb" opacity=".75">
      <!-- power plant -->
      <rect x="150" y="150" width="16" height="90"/><rect x="184" y="140" width="16" height="100"/>
      <rect x="120" y="190" width="140" height="60"/><rect x="260" y="205" width="70" height="45"/>
      <!-- wind turbines -->
      <g stroke="#bfe2fb" stroke-width="4" stroke-linecap="round"><path d="M60 250V150M60 150l-22-34M60 150l38 6M60 150l-14 36"/><path d="M380 250V170M380 170l-18-28M380 170l30 5M380 170l-11 29"/></g>
      <!-- city -->
      <rect x="560" y="214" width="36" height="36"/><rect x="600" y="196" width="26" height="54"/><rect x="632" y="222" width="40" height="28"/>
      <rect x="980" y="200" width="30" height="50"/><rect x="1014" y="182" width="22" height="68"/><rect x="1040" y="214" width="44" height="36"/>
      <!-- transmission towers -->
      <g fill="none" stroke="#bfe2fb" stroke-width="3"><path d="M1240 250l18-110 18 110M1246 214h24M1250 186h16M1236 160h44M1242 176h32"/><path d="M1400 250l14-86 14 86M1405 222h18M1408 198h12M1396 178h36"/><path d="M1276 160Q1340 150 1410 178" stroke-width="1.5"/></g>
    </g>
    <path d="M0 240 C 360 170 760 300 1100 236 S 1480 190 1600 214 V300 H0Z" fill="url(#sw1)" opacity=".9"/>
    <path d="M0 262 C 420 214 820 316 1160 262 S 1500 236 1600 250 V300 H0Z" fill="url(#sw2)"/>
    <path d="M0 252 C 380 196 790 306 1130 248 S 1490 214 1600 232" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
  </svg>
</div>
<main class="stage" id="stage">
  <section class="wheel" aria-label="Roda undian">
    <div class="beams" aria-hidden="true"></div>
    <canvas id="c" width="1000" height="1000" role="img" aria-label="Roda undian berisi nama peserta"></canvas>
    <svg class="pin" id="pin" viewBox="0 0 80 112" aria-hidden="true">
      <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#f5a623"/><stop offset=".5" stop-color="#ffd95a"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs>
      <path d="M40 108 L13 36 A29 29 0 1 1 67 36 Z" fill="url(#pg)" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="40" cy="31" r="11" fill="#0d3577" stroke="#fff" stroke-width="3"/>
    </svg>
  </section>
  <aside class="panel">
    <p class="event">Customer Gathering</p>
    <h1>Undian Doorprize</h1>
    <p class="tag"><span class="a">“Beyond Energy</span> <span class="b">Beyond Collaboration”</span></p>
    <div class="sweep" aria-hidden="true"></div>
    <div class="serial"><small>Undian ke</small><b id="serial">No. 001</b></div>
    <p id="mode" class="mode" aria-live="polite"></p>
    <button id="spin" class="spin">Putar roda</button>
    <p class="hint">atau tekan <kbd>Spasi</kbd></p>
    <div class="ledger"><h2>Pemenang</h2><ol id="log"></ol></div>
    <p class="count" id="count"></p>
    <p class="place">Bogor, November 2026</p>
  </aside>
</main>

<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-labelledby="winName">
  <span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span>
  <svg class="rsweep" viewBox="0 0 1600 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 240 C 360 170 760 300 1100 236 S 1480 190 1600 214 V300 H0Z" fill="url(#sw1)" opacity=".85"/>
    <path d="M0 262 C 420 214 820 316 1160 262 S 1500 236 1600 250 V300 H0Z" fill="#0b3f91"/>
  </svg>
  <div class="win">
    <div class="badge" aria-hidden="true"><small>NO.</small><b id="badgeNo">001</b></div>
    <p class="win-lead" id="winLead">Doorprize No. 001 · Selamat kepada</p>
    <p class="win-name" id="winName"></p>
    <p class="win-sub">mendapat doorprize</p>
    <p class="win-note" id="winNote" hidden>Hadiah Spesial Pilihan Juri</p>
    <p class="win-tag"><span class="a">“Beyond Energy</span> <span class="b">Beyond Collaboration”</span></p>
    <button class="next" id="next">Lanjut</button>
  </div>
</div>

<script>
(function(){
var KEY='doorprize',TAU=2*Math.PI;
var DEF={names:['A','B','C','D','E'],mode:'random',winners:[],remove:true,log:[]};
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)))}catch(e){return Object.assign({},DEF)}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function $(id){return document.getElementById(id)}

var cv=$('c'),ctx=cv.getContext('2d'),W=cv.width,C=W/2,RS=452,BULBS=36,lights='idle',chasePos=0;
// event palette: fill + text colour
var TONES=[['#0d47a1','#ffffff'],['#ffc928','#08245a'],['#1e88e5','#ffffff'],['#f28c28','#08245a'],['#00838f','#ffffff'],['#6cc8f2','#08245a']];
var REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
var s=load(),rot=0,spinning=false,revealOpen=false,wheelImg=null,lastTick=null,chase=0;

function pad(n){return String(n).padStart(3,'0')}
// Segment under the pointer (top, angle -PI/2) for a given rotation.
function indexAt(r,n){var seg=TAU/n;return Math.floor((((-Math.PI/2-r)%TAU)+TAU)%TAU/seg)%n}
// Preset mode: take the next queued winner that is still on the wheel; otherwise random.
function pick(names,mode,queue,rand){
  if(mode==='preset'){var low=names.map(function(x){return x.toLowerCase()});
    while(queue.length){var i=low.indexOf(queue.shift().toLowerCase());if(i>=0)return i}}
  return Math.floor(rand()*names.length);
}
function tone(i,n){var t=i%TONES.length;if(i===n-1&&i>0&&t===0)t=2;return TONES[t]}

function buildWheel(){
  var n=s.names,o=document.createElement('canvas');o.width=o.height=W;
  var g=o.getContext('2d'),i;g.translate(C,C);
  if(!n.length){
    g.beginPath();g.arc(0,0,RS,0,TAU);g.fillStyle='#0d3577';g.fill();
    g.fillStyle='#cfe6ff';g.font='italic 700 34px Montserrat, sans-serif';g.textAlign='center';g.fillText('Roda kosong',0,190);
    wheelImg=o;return;
  }
  var seg=TAU/n.length;
  for(i=0;i<n.length;i++){
    g.beginPath();g.moveTo(0,0);g.arc(0,0,RS,i*seg,(i+1)*seg);g.closePath();g.fillStyle=tone(i,n.length)[0];g.fill();
  }
  // flowing energy lines, like the backdrop's sweep
  g.save();g.beginPath();g.arc(0,0,RS,0,TAU);g.clip();
  for(var k=0;k<9;k++){
    g.beginPath();
    for(var x=-RS;x<=RS;x+=6){var y=-RS+k*110+Math.sin(x/120+k)*42+x*.18;x===-RS?g.moveTo(x,y):g.lineTo(x,y)}
    g.lineWidth=k%3?1.4:3;g.strokeStyle=k%3?'rgba(255,255,255,.13)':'rgba(255,255,255,.09)';g.stroke();
  }
  g.restore();
  for(i=0;i<n.length;i++){
    var tc=tone(i,n.length);
    g.save();g.rotate(i*seg);
    g.strokeStyle='#ffffff';g.lineWidth=3;g.beginPath();g.moveTo(108,0);g.lineTo(RS,0);g.stroke();
    g.rotate(seg/2);
    var fs=Math.min(46,Math.max(16,520/n.length)),maxW=RS-150,label=n[i];
    g.font='800 '+fs+'px Montserrat, sans-serif';
    while(g.measureText(label).width>maxW&&fs>15){fs--;g.font='800 '+fs+'px Montserrat, sans-serif'}
    while(g.measureText(label).width>maxW&&label.length>2)label=label.slice(0,-2)+'…';
    g.textAlign='right';g.textBaseline='middle';
    if(tc[1]==='#ffffff'){g.shadowColor='rgba(2,18,56,.5)';g.shadowBlur=6;g.shadowOffsetY=2}
    g.fillStyle=tc[1];g.fillText(label,RS-28,0);
    g.restore();
  }
  g.strokeStyle='#ffffff';g.lineWidth=5;g.beginPath();g.arc(0,0,RS,0,TAU);g.stroke();
  wheelImg=o;
}
// polished gold for the marquee ring
function goldFill(){
  if(!ctx.createConicGradient){var l=ctx.createLinearGradient(0,0,W,W);l.addColorStop(0,'#fff1b8');l.addColorStop(.5,'#b9861f');l.addColorStop(1,'#ffe08a');return l}
  var g=ctx.createConicGradient(-.6,C,C),st=['#fff4c8','#c8962e','#ffe08a','#8f6214','#fff1b8','#b9861f','#ffe7a0','#9a6b17','#fff4c8'];
  st.forEach(function(c,i){g.addColorStop(i/(st.length-1),c)});return g;
}
var GOLD=goldFill();
// bulb brightness 0..1 by light show: idle = slow travelling shimmer, spin = comet chase, win = alternate blink
function bulbLevel(i,now){
  if(lights==='win')return (i+Math.floor(now/140))%2?1:.25;
  if(lights==='spin'){var d=((i-chasePos)%BULBS+BULBS)%BULBS,best=0;
    for(var h=0;h<3;h++){var dd=Math.abs(((d-h*BULBS/3)%BULBS+BULBS)%BULBS-BULBS/2)-BULBS/2;best=Math.max(best,Math.exp(-dd*dd/3))}
    return .18+.82*best}
  var w=.5+.5*Math.sin(now/520-i*TAU/12);return .22+.78*Math.pow(w,5);
}
function mix(a,b,t){return 'rgb('+[0,1,2].map(function(k){return Math.round(a[k]+(b[k]-a[k])*t)}).join(',')+')'}
var sparks=[];
function draw(now){
  now=now||performance.now();
  ctx.clearRect(0,0,W,W);
  // marquee ring: gold bezel, navy channel, gold inner rule
  ctx.beginPath();ctx.arc(C,C,499,0,TAU);ctx.fillStyle=GOLD;ctx.fill();
  ctx.beginPath();ctx.arc(C,C,488,0,TAU);ctx.fillStyle='#061d47';ctx.fill();
  ctx.beginPath();ctx.arc(C,C,463,0,TAU);ctx.fillStyle=GOLD;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,250,225,.7)';ctx.beginPath();ctx.arc(C,C,497,Math.PI*1.1,Math.PI*1.7);ctx.stroke();
  var lv=[],b,a,x,y;
  for(b=0;b<BULBS;b++){
    lv[b]=bulbLevel(b,now);a=b/BULBS*TAU-Math.PI/2;x=C+Math.cos(a)*475.5;y=C+Math.sin(a)*475.5;
    ctx.beginPath();ctx.arc(x,y,11,0,TAU);ctx.fillStyle="#8f6214";ctx.fill();            // socket
    var G=ctx.createRadialGradient(x-3,y-3,.5,x,y,9.5);
    G.addColorStop(0,'#ffffff');G.addColorStop(.35,mix([255,214,110],[255,250,228],lv[b]));G.addColorStop(1,mix([110,78,18],[255,196,60],lv[b]));
    ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fillStyle=G;ctx.fill();                      // glass
  }
  // bloom: additive warm glow on top of everything around the ring
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(b=0;b<BULBS;b++){if(lv[b]<.35)continue;a=b/BULBS*TAU-Math.PI/2;x=C+Math.cos(a)*475.5;y=C+Math.sin(a)*475.5;
    var r=18+26*lv[b],Gl=ctx.createRadialGradient(x,y,0,x,y,r);
    Gl.addColorStop(0,'rgba(255,226,140,'+(.65*lv[b])+')');Gl.addColorStop(1,'rgba(255,190,60,0)');
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=Gl;ctx.fill()}
  // twinkles on the gold bezel
  if(!REDUCED&&Math.random()<.06&&sparks.length<4)sparks.push({a:Math.random()*TAU,r:Math.random()<.5?494:460,t0:now});
  sparks=sparks.filter(function(p){var k=(now-p.t0)/700;if(k>1)return false;
    var sx=C+Math.cos(p.a)*p.r,sy=C+Math.sin(p.a)*p.r,sz=11*Math.sin(k*Math.PI);
    ctx.fillStyle='rgba(255,252,235,'+Math.sin(k*Math.PI)+')';ctx.beginPath();
    ctx.moveTo(sx,sy-sz);ctx.quadraticCurveTo(sx,sy,sx+sz,sy);ctx.quadraticCurveTo(sx,sy,sx,sy+sz);ctx.quadraticCurveTo(sx,sy,sx-sz,sy);ctx.quadraticCurveTo(sx,sy,sx,sy-sz);ctx.fill();return true});
  ctx.restore();
  ctx.save();ctx.translate(C,C);ctx.rotate(rot);ctx.drawImage(wheelImg,-C,-C);ctx.restore();
  // soft light from the top
  var L=ctx.createRadialGradient(C-120,C-200,20,C,C,470);
  L.addColorStop(0,'rgba(255,255,255,.22)');L.addColorStop(.45,'rgba(255,255,255,0)');L.addColorStop(1,'rgba(3,24,70,.22)');
  ctx.beginPath();ctx.arc(C,C,RS,0,TAU);ctx.fillStyle=L;ctx.fill();
  // hub carrying the draw number
  ctx.beginPath();ctx.arc(C,C,112,0,TAU);ctx.fillStyle=GOLD;ctx.fill();
  ctx.beginPath();ctx.arc(C,C,100,0,TAU);ctx.fillStyle='#ffffff';ctx.fill();
  var H=ctx.createRadialGradient(C-26,C-30,6,C,C,96);H.addColorStop(0,'#2f86e0');H.addColorStop(1,'#08245a');
  ctx.beginPath();ctx.arc(C,C,94,0,TAU);ctx.fillStyle=H;ctx.fill();
  ctx.fillStyle='#cfe6ff';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='800 15px Montserrat, sans-serif';ctx.fillText('N O.',C,C-34);
  ctx.fillStyle='#ffffff';ctx.font='60px Anton, Impact, sans-serif';ctx.fillText(pad(s.log.length+1),C,C+14);
}
function render(){
  var preset=s.mode==='preset';
  // random mode shows nothing; preset mode is always disclosed (product principle 2)
  $('mode').textContent=preset?'Hadiah spesial dari panitia.':'';
  $('mode').hidden=!preset;$('mode').classList.toggle('preset',preset);
  $('serial').textContent='No. '+pad(s.log.length+1);
  $('count').textContent=s.names.length?s.names.length+' nama di roda':'Roda kosong. Isi nama peserta di halaman admin.';
  var ol=$('log');ol.innerHTML='';
  if(!s.log.length){var e=document.createElement('li');e.className='empty';e.textContent='Belum ada pemenang.';ol.appendChild(e)}
  s.log.forEach(function(w,i){var li=document.createElement('li');
    li.innerHTML='<span class="no">No. '+pad(i+1)+'</span><span class="dots"></span><span class="nm"></span>';
    li.lastChild.textContent=w;ol.appendChild(li)});
  ol.scrollTop=ol.scrollHeight;
  $('spin').disabled=spinning||!s.names.length;
  buildWheel();draw();
}

var pin=$('pin');
function flick(){
  if(REDUCED)return;
  pin.style.transition='none';pin.style.transform='rotate(-16deg)';
  requestAnimationFrame(function(){pin.style.transition='transform .22s cubic-bezier(.2,1.6,.4,1)';pin.style.transform='rotate(0)'});
}
function spin(){
  if(spinning)return;
  s=load();var n=s.names.slice();
  if(!n.length)return;
  spinning=true;$('spin').disabled=true;
  var q=s.winners.slice(),i=pick(n,s.mode,q,Math.random);
  s.winners=q;save(s); // consume the queue now, so admin sees it
  var seg=TAU/n.length,jitter=(Math.random()-.5)*seg*.7;
  var tgt=((-Math.PI/2-(i+.5)*seg+jitter)%TAU+TAU)%TAU,cur=(rot%TAU+TAU)%TAU;
  var delta=(tgt-cur+TAU)%TAU+TAU*(REDUCED?1:6+Math.floor(Math.random()*3));
  var wind=REDUCED?0:Math.min(.35,seg*.6),windDur=REDUCED?0:420,dur=REDUCED?1400:6200;
  var start=rot,t0=performance.now(),prev=rot;lastTick=null;lights='spin';
  (function step(t){
    var e=t-t0;
    if(e<windDur){rot=start-wind*Math.sin(e/windDur*Math.PI/2)}
    else{var k=Math.min(1,(e-windDur)/dur),ez=1-Math.pow(1-k,4);rot=start-wind+(delta+wind)*ez}
    chasePos+=(rot-prev)*BULBS/TAU*1.6+.04;prev=rot; // lights race with the wheel, then slow with it
    var b=Math.floor(((-Math.PI/2-rot)%TAU+TAU)%TAU/seg);
    if(lastTick!==null&&b!==lastTick)flick();lastTick=b;
    draw(t);
    if(e<windDur+dur)requestAnimationFrame(step);else done(n[indexAt(rot,n.length)]);
  })(t0);
}
function done(name){
  // record and remove in one write, so a reload mid-reveal can't let the same name win twice;
  // the wheel on screen keeps the winning slice until "Lanjut"
  s=load();s.log.push(name);
  if(s.remove){var j=s.names.indexOf(name);if(j>=0)s.names.splice(j,1)}
  save(s);
  lights='win';setTimeout(function(){lights='idle'},2600);
  var no=pad(s.log.length);
  $('badgeNo').textContent=no;$('winLead').textContent='Doorprize No. '+no+' · Selamat kepada';
  $('winName').textContent=name;$('winNote').hidden=s.mode!=='preset';
  var st=$('stage');st.classList.remove('surge');st.offsetWidth;st.classList.add('surge');
  var rv=$('reveal');rv.hidden=false;revealOpen=true;
  rv.querySelectorAll('.ring,.badge,.win-name').forEach(function(el){el.style.animation='none';el.offsetWidth;el.style.animation=''});
  $('next').focus();
}
function closeReveal(){
  if(!revealOpen)return;
  $('reveal').hidden=true;revealOpen=false;
  s=load();spinning=false;render();$('spin').focus();
}
// light show runs continuously while the wheel rests (the spin loop draws its own frames)
if(!REDUCED)requestAnimationFrame(function loop(t){if(wheelImg&&(!spinning||revealOpen))draw(t);requestAnimationFrame(loop)});

$('spin').addEventListener('click',spin);
$('next').addEventListener('click',closeReveal);
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key==='Enter'||e.key==='Escape'){
    if(revealOpen){e.preventDefault();closeReveal()}
    else if(e.code==='Space'&&!e.repeat){e.preventDefault();spin()}
  }
});
addEventListener('storage',function(e){if(e.key===KEY&&!spinning){s=load();render()}});

render();
// canvas text needs the web fonts; redraw once they are in
Promise.all([document.fonts.load('40px Anton'),document.fonts.load('800 20px Montserrat')]).then(function(){render()},function(){});

// self-check: the slice under the pointer is always the one that was picked
for(var n=1;n<=40;n++)for(var i=0;i<n;i++)for(var j=-.35;j<=.35;j+=.35){var sg=TAU/n;
  console.assert(indexAt(-Math.PI/2-(i+.5)*sg+j*sg+TAU*7,n)===i,'indexAt',n,i,j)}
console.assert(pick(['A','B','C'],'preset',['x','c'],Math.random)===2,'pick preset');
console.assert(pick(['A','B'],'random',['b'],function(){return 0})===0,'pick random');
})();
</script>
