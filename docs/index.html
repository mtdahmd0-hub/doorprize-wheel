<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doorprize · Customer Gathering PLN UIK Tanjung Jati B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:ital,wght@0,500..800;1,500..800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-1:#1a63c7;--sky-2:#3d95e6;--sky-3:#8fd0f5;
  --navy:#08245a;--navy-2:#0d3577;--panel:rgba(7,38,96,.84);
  --volt:#ffc928;--volt-2:#f5a623;--ember:#f28c28;--cyan:#7fdcff;
  --white:#fff;--soft:#cfe6ff;--alert:#c62828;--rule:rgba(255,255,255,.22);
  --display:"Anton","Impact",sans-serif;--ui:"Montserrat","Segoe UI",system-ui,sans-serif;
  --row:clamp(70px,14vh,124px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--white);font-family:var(--ui);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(40% 30% at 12% 18%,rgba(255,255,255,.35),transparent 70%),radial-gradient(35% 26% at 88% 22%,rgba(255,255,255,.3),transparent 70%),linear-gradient(180deg,var(--sky-1),var(--sky-2) 48%,var(--sky-3)) fixed;background-color:var(--sky-2)}
::selection{background:var(--volt);color:var(--navy)}
:focus-visible{outline:3px solid var(--volt);outline-offset:3px}
.horizon{position:fixed;left:0;right:0;bottom:0;height:min(30vh,300px);z-index:0;pointer-events:none}
.horizon svg{position:absolute;inset:0;width:100%;height:100%}

.stage{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,.65fr);gap:clamp(20px,3vw,56px);align-items:center;min-height:100dvh;max-width:1680px;margin:0 auto;padding:clamp(16px,3vw,44px)}
.stage.surge{animation:surge .6s cubic-bezier(.36,.07,.19,.97) both}

/* the machine */
.machine{position:relative;border-radius:28px;padding:clamp(14px,1.6vw,22px);background:linear-gradient(180deg,#0f3f8c,#08245a);box-shadow:0 30px 60px -20px rgba(3,20,60,.75),inset 0 0 0 3px rgba(255,255,255,.18)}
.bulbs{position:absolute;inset:7px;border-radius:22px;pointer-events:none;
  background:
    radial-gradient(circle,var(--bulb) 0 4px,transparent 5px) 0 0/34px 34px repeat-x,
    radial-gradient(circle,var(--bulb) 0 4px,transparent 5px) 17px 100%/34px 34px repeat-x,
    radial-gradient(circle,var(--bulb) 0 4px,transparent 5px) 0 17px/34px 34px repeat-y,
    radial-gradient(circle,var(--bulb) 0 4px,transparent 5px) 100% 0/34px 34px repeat-y;
  --bulb:#ffc928;animation:chase 1.2s steps(2) infinite}
.machine.go .bulbs{animation-duration:.24s}
.marquee{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 6px 14px;padding:10px 16px;border-radius:14px;background:linear-gradient(90deg,#1a63c7,#3d95e6 45%,#ffc928 78%,#f28c28);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.marquee b{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,2.6vw,2.4rem);letter-spacing:.06em;text-transform:uppercase;color:var(--white);text-shadow:0 3px 10px rgba(3,20,60,.5)}
.marquee svg{width:clamp(22px,2.4vw,34px);height:auto;flex:none}
.reels{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,14px);padding:clamp(10px,1.2vw,16px);border-radius:18px;background:#041a42;box-shadow:inset 0 6px 18px rgba(0,0,0,.55)}
.reel{position:relative;height:calc(var(--row)*3);overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#dfeeff,#ffffff 30%,#ffffff 70%,#dfeeff)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:var(--row);z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(180deg,rgba(4,26,66,.55),rgba(4,26,66,0))}
.reel::after{bottom:0;background:linear-gradient(0deg,rgba(4,26,66,.55),rgba(4,26,66,0))}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:var(--row);display:flex;align-items:center;justify-content:center;padding:0 12px;text-align:center;font-weight:800;font-size:clamp(1rem,1.8vw,1.8rem);line-height:1.1;color:var(--navy);border-bottom:1px solid rgba(8,36,90,.08);overflow:hidden}
.cell span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.reel.blur .strip{filter:blur(1.4px)}
.payline{position:absolute;left:4px;right:4px;top:50%;height:var(--row);translate:0 -50%;border-radius:12px;border:3px solid var(--volt);box-shadow:0 0 0 3px rgba(255,201,40,.25);pointer-events:none;z-index:3}
.payline::before,.payline::after{content:"";position:absolute;top:50%;translate:0 -50%;border:12px solid transparent}
.payline::before{left:-20px;border-left-color:var(--volt)}
.payline::after{right:-20px;border-right-color:var(--volt)}
.reel.hit{animation:hit .5s ease-out}
.machine.win .payline{animation:lit .25s steps(2) 6}

.panel{display:flex;flex-direction:column;gap:clamp(14px,2vh,22px);min-width:0;background:var(--panel);border-radius:18px;padding:clamp(20px,2.4vw,30px);box-shadow:0 24px 60px -20px rgba(4,24,70,.7)}
.event{margin:0;font-family:var(--display);font-size:clamp(1.1rem,1.6vw,1.5rem);line-height:1.05;color:var(--soft);text-transform:uppercase}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3rem,5vw,5.2rem);line-height:.9;text-transform:uppercase;text-shadow:0 6px 22px rgba(3,24,70,.55)}
.tag{margin:-4px 0 0;font-weight:700;font-style:italic;font-size:clamp(.9rem,1.2vw,1.1rem)}
.tag .a{color:var(--cyan)}.tag .b{color:var(--volt)}
.sweep{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--sky-2),var(--cyan) 45%,var(--volt) 75%,var(--ember))}
.serial{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.serial small{font-size:.78rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.serial b{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,3.2vw,3rem);color:var(--volt);line-height:1}
.mode{order:99;margin:0;padding:10px 0 0;border-top:1px solid var(--rule);color:var(--soft);font-weight:500;font-style:italic;font-size:.95rem;line-height:1.35}
.mode[hidden]{display:none}
.spin{appearance:none;border:0;cursor:pointer;width:100%;padding:20px 24px;border-radius:14px;background:linear-gradient(180deg,#ffd95a,var(--volt) 55%,var(--volt-2));color:var(--navy);font-family:var(--display);font-size:1.7rem;letter-spacing:.08em;text-transform:uppercase;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 26px -8px rgba(3,20,60,.7);transition:filter .2s,transform .12s,opacity .2s}
.spin:hover{filter:brightness(1.06)}.spin:active{transform:translateY(2px)}
.spin:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.hint{margin:-8px 0 0;text-align:center;color:var(--soft);font-size:.82rem}
.hint kbd{font-family:var(--ui);font-weight:700;font-size:.72rem;border:1px solid var(--rule);border-radius:6px;padding:1px 7px}
.ledger h2{margin:0 0 6px;font-size:.78rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--soft)}
.ledger ol{list-style:none;margin:0;padding:0;max-height:min(22vh,200px);overflow:auto}
.ledger li{display:flex;align-items:baseline;gap:10px;padding:6px 0}
.ledger .no{font-size:.8rem;font-weight:700;color:var(--volt);flex:none}
.ledger .dots{flex:1;border-bottom:1px dotted rgba(255,255,255,.35);translate:0 -4px;min-width:20px}
.ledger .nm{font-weight:700;font-size:1.05rem;text-align:right;overflow-wrap:anywhere}
.ledger .empty{color:var(--soft);font-style:italic}
.count,.place{margin:0;color:var(--soft);font-size:.84rem}

/* lightning */
#bolt{position:fixed;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;overflow:visible}
#bolt path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.flash{position:fixed;inset:0;z-index:9;pointer-events:none;background:#fff;opacity:0}
.flash.on{animation:flash .5s ease-out}

/* reveal */
.reveal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(26,99,199,.92),rgba(6,30,78,.96) 72%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .3s ease-out both}
.reveal[hidden]{display:none}
.ring{position:absolute;left:50%;top:46%;width:56vmin;aspect-ratio:1;border-radius:50%;border:3px solid var(--volt);translate:-50% -50%;opacity:0;animation:pulse 2.2s cubic-bezier(.16,1,.3,1) both}
.ring:nth-child(2){animation-delay:.3s;border-color:var(--cyan)}
.ring:nth-child(3){animation-delay:.6s;border-color:var(--ember)}
.win{position:relative;text-align:center;max-width:min(100%,1150px)}
.badge{width:clamp(92px,11vmin,124px);aspect-ratio:1;margin:0 auto 16px;border-radius:50%;display:grid;place-content:center;color:var(--navy);background:radial-gradient(circle at 35% 30%,#fff3b8 0 8%,var(--volt) 40%,var(--volt-2));box-shadow:0 0 0 6px rgba(255,201,40,.25),0 16px 30px rgba(3,20,60,.55);animation:pop .6s cubic-bezier(.2,1.5,.35,1) .1s both}
.badge small{font:800 .7rem var(--ui);letter-spacing:.2em}.badge b{font:400 2.3rem/1 var(--display)}
.win-lead{margin:0;font-size:clamp(.9rem,1.5vw,1.15rem);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.win-name{margin:.08em 0 .06em;font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,10vw,8.6rem);line-height:1;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance;text-shadow:0 8px 30px rgba(2,18,56,.65);animation:pop .7s cubic-bezier(.2,1.5,.35,1) .3s both}
.win-sub{margin:0;font-weight:700;font-style:italic;font-size:clamp(1.1rem,2.2vw,1.8rem);color:var(--volt)}
.win-note{margin:16px auto 0;max-width:44ch;font-size:.95rem;font-weight:500;font-style:italic;color:var(--soft)}
.win-note[hidden]{display:none}
.next{margin-top:clamp(18px,3vh,30px);appearance:none;cursor:pointer;background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.7);border-radius:12px;padding:11px 30px;font:800 1rem var(--ui);letter-spacing:.14em;text-transform:uppercase}
.next:hover{background:var(--volt);border-color:var(--volt);color:var(--navy)}

@keyframes chase{50%{--bulb:#fff6c2}}
@keyframes hit{0%{transform:translateY(0)}35%{transform:translateY(6px)}100%{transform:translateY(0)}}
@keyframes lit{50%{border-color:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.4)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(2.8)}}
@keyframes pop{0%{opacity:0;transform:scale(1.35);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{transform:scale(1)}}
@keyframes surge{10%,90%{translate:-1px 0}20%,80%{translate:3px 0}30%,50%,70%{translate:-4px 0}40%,60%{translate:4px 0}}
@property --bulb{syntax:"<color>";inherits:true;initial-value:#ffc928}
@media (max-width:900px){.stage{grid-template-columns:1fr;padding-bottom:120px}.cell{font-size:.85rem;padding:0 6px}}
@media (prefers-reduced-motion:reduce){.bulbs,.win-name,.badge,.reveal,.stage.surge,.reel.hit,.machine.win .payline{animation:none}.ring{display:none}.flash.on{animation:none}}
</style>
</head>
<body>
<div class="horizon" aria-hidden="true">
  <svg viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice">
    <defs><linearGradient id="sw1" x1="0" x2="1"><stop offset="0" stop-color="#1a63c7"/><stop offset=".45" stop-color="#4fb8f0"/><stop offset=".72" stop-color="#ffd95a"/><stop offset="1" stop-color="#f28c28"/></linearGradient>
    <linearGradient id="sw2" x1="0" x2="1"><stop offset="0" stop-color="#0b3f91"/><stop offset=".6" stop-color="#1a63c7"/><stop offset="1" stop-color="#3d95e6"/></linearGradient></defs>
    <g fill="#bfe2fb" opacity=".75"><rect x="150" y="150" width="16" height="90"/><rect x="184" y="140" width="16" height="100"/><rect x="120" y="190" width="140" height="60"/><rect x="260" y="205" width="70" height="45"/>
      <g stroke="#bfe2fb" stroke-width="4" stroke-linecap="round"><path d="M60 250V150M60 150l-22-34M60 150l38 6M60 150l-14 36"/><path d="M380 250V170M380 170l-18-28M380 170l30 5M380 170l-11 29"/></g>
      <rect x="980" y="200" width="30" height="50"/><rect x="1014" y="182" width="22" height="68"/><rect x="1040" y="214" width="44" height="36"/>
      <g fill="none" stroke="#bfe2fb" stroke-width="3"><path d="M1240 250l18-110 18 110M1246 214h24M1250 186h16M1236 160h44M1242 176h32"/><path d="M1400 250l14-86 14 86M1405 222h18M1408 198h12M1396 178h36"/><path d="M1276 160Q1340 150 1410 178" stroke-width="1.5"/></g></g>
    <path d="M0 240 C 360 170 760 300 1100 236 S 1480 190 1600 214 V300 H0Z" fill="url(#sw1)" opacity=".9"/>
    <path d="M0 262 C 420 214 820 316 1160 262 S 1500 236 1600 250 V300 H0Z" fill="url(#sw2)"/>
  </svg>
</div>
<main class="stage" id="stage">
  <section class="machine" id="machine" aria-label="Mesin undian">
    <div class="bulbs" aria-hidden="true"></div>
    <div class="marquee">
      <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M14 1 3 18h8l-3 13 13-19h-8z" fill="#fff" stroke="#08245a" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <b>Sambaran Doorprize</b>
      <svg viewBox="0 0 24 32" aria-hidden="true"><path d="M14 1 3 18h8l-3 13 13-19h-8z" fill="#fff" stroke="#08245a" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </div>
    <div class="reels" id="reels">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="payline" aria-hidden="true"></div>
    </div>
  </section>
  <aside class="panel">
    <p class="event">Customer Gathering<br>PLN UIK Tanjung Jati B</p>
    <h1>Undian Doorprize</h1>
    <p class="tag"><span class="a">“Beyond Energy</span> <span class="b">Beyond Collaboration”</span></p>
    <div class="sweep" aria-hidden="true"></div>
    <div class="serial"><small>Undian ke</small><b id="serial">No. 001</b></div>
    <p id="mode" class="mode" hidden>Hadiah spesial dari panitia.</p>
    <button id="spin" class="spin">Tarik!</button>
    <p class="hint">atau tekan <kbd>Spasi</kbd></p>
    <div class="ledger"><h2>Pemenang</h2><ol id="log"></ol></div>
    <p class="count" id="count"></p>
    <p class="place">Bogor, November 2026</p>
  </aside>
</main>
<svg id="bolt" aria-hidden="true"></svg>
<div class="flash" id="flash"></div>
<div class="reveal" id="reveal" hidden role="dialog" aria-modal="true" aria-labelledby="winName">
  <span class="ring"></span><span class="ring"></span><span class="ring"></span>
  <div class="win">
    <div class="badge" aria-hidden="true"><small>NO.</small><b id="badgeNo">001</b></div>
    <p class="win-lead" id="winLead"></p>
    <p class="win-name" id="winName"></p>
    <p class="win-sub">mendapat doorprize</p>
    <p class="win-note" id="winNote" hidden>Pemenang ditentukan oleh panitia.</p>
    <button class="next" id="next">Lanjut</button>
  </div>
</div>
<script>
(function(){
var KEY='doorprize';
var DEF={names:['A','B','C','D','E'],mode:'random',winners:[],remove:true,log:[]};
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)))}catch(e){return Object.assign({},DEF)}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function $(id){return document.getElementById(id)}
function pad(n){return String(n).padStart(3,'0')}
function pick(names,mode,queue,rand){
  if(mode==='preset'){var low=names.map(function(x){return x.toLowerCase()});
    while(queue.length){var i=low.indexOf(queue.shift().toLowerCase());if(i>=0)return i}}
  return Math.floor(rand()*names.length);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
var reels=[].slice.call(document.querySelectorAll('.reel')),s=load(),spinning=false,revealOpen=false;

function cells(strip,list){strip.innerHTML='';list.forEach(function(nm){var d=document.createElement('div');d.className='cell';d.innerHTML='<span></span>';d.firstChild.textContent=nm;strip.appendChild(d)})}
function rowH(){return reels[0].querySelector('.cell')?reels[0].querySelector('.cell').getBoundingClientRect().height:80}
function idle(){ // resting reels: three different names around the payline
  var n=s.names.length?s.names:['—'];
  reels.forEach(function(r,k){var sh=shuffle(n),l=[];for(var i=0;i<3;i++)l.push(sh[(i+k)%sh.length]);cells(r.firstChild,l);r.firstChild.style.transform='translateY(0)'});
}
function render(){
  var preset=s.mode==='preset';$('mode').hidden=!preset;
  $('serial').textContent='No. '+pad(s.log.length+1);
  $('count').textContent=s.names.length?s.names.length+' nama di mesin':'Mesin kosong. Isi nama peserta di halaman admin.';
  var ol=$('log');ol.innerHTML='';
  if(!s.log.length)ol.innerHTML='<li class="empty">Belum ada pemenang.</li>';
  s.log.forEach(function(w,i){var li=document.createElement('li');li.innerHTML='<span class="no">No. '+pad(i+1)+'</span><span class="dots"></span><span class="nm"></span>';li.lastChild.textContent=w;ol.appendChild(li)});
  ol.scrollTop=ol.scrollHeight;$('spin').disabled=spinning||!s.names.length;
}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeBack(t){var c1=1.15,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)} // last reel teases past, then settles

function spin(){
  if(spinning)return;
  s=load();var n=s.names.slice();if(!n.length)return;
  spinning=true;render();
  var q=s.winners.slice(),win=n[pick(n,s.mode,q,Math.random)];
  s.winners=q;save(s);
  var H=rowH(),m=$('machine');m.classList.add('go');m.classList.remove('win');
  var finished=0;
  reels.forEach(function(r,k){
    // strip: random names, winner placed at the row that will sit on the payline
    var len=REDUCED?6:34+k*14,list=[],pool=[];
    while(list.length<len+2){if(!pool.length)pool=shuffle(n);list.push(pool.pop())}
    list[len]=win;
    if(n.length>1)while(list[len+1]===win||list[len-1]===win){list[len+1]=n[Math.floor(Math.random()*n.length)];list[len-1]=n[Math.floor(Math.random()*n.length)]}
    cells(r.firstChild,list);
    var dist=(len-1)*H,dur=REDUCED?500+k*200:2100+k*900,t0=performance.now()+k*120,ease=k===2&&!REDUCED?easeBack:easeOut;
    r.classList.add('blur');
    (function step(t){
      var e=Math.max(0,t-t0),p=Math.min(1,e/dur);
      r.firstChild.style.transform='translateY('+(-dist*ease(p))+'px)';
      if(p>.82)r.classList.remove('blur');
      if(p<1)requestAnimationFrame(step);
      else{r.classList.remove('hit');r.offsetWidth;r.classList.add('hit');if(++finished===3)strike(win)}
    })(performance.now());
  });
}
function boltPath(x0,y0,x1,y1,j){var d='M'+x0+' '+y0,steps=14;for(var i=1;i<steps;i++){var t=i/steps;d+=' L'+(x0+(x1-x0)*t+(Math.random()-.5)*j)+' '+(y0+(y1-y0)*t+(Math.random()-.5)*j*.3)}return d+' L'+x1+' '+y1}
function strike(win){
  $('machine').classList.remove('go');$('machine').classList.add('win');
  if(!REDUCED){
    var pr=document.querySelector('.payline').getBoundingClientRect(),x=pr.left+pr.width/2,y=pr.top+pr.height/2,svg=$('bolt'),W=innerWidth;
    var main=boltPath(x+(Math.random()-.5)*W*.3,-20,x,y,90),fork=boltPath(x,y*.45,x+(Math.random()<.5?-1:1)*W*.12,y*.8,50);
    svg.innerHTML='<path d="'+main+'" stroke="#7fdcff" stroke-width="14" opacity=".35"/><path d="'+main+'" stroke="#fff" stroke-width="4"/><path d="'+fork+'" stroke="#ffe680" stroke-width="2.5"/>';
    var f=$('flash');f.classList.remove('on');f.offsetWidth;f.classList.add('on');
    var st=$('stage');st.classList.remove('surge');st.offsetWidth;st.classList.add('surge');
    setTimeout(function(){svg.innerHTML=''},380);
  }
  setTimeout(function(){done(win)},REDUCED?200:1300);
}
function done(name){
  s=load();s.log.push(name);
  if(s.remove){var j=s.names.indexOf(name);if(j>=0)s.names.splice(j,1)}
  save(s);
  var no=pad(s.log.length);
  $('badgeNo').textContent=no;$('winLead').textContent='Doorprize No. '+no+' · Selamat kepada';
  $('winName').textContent=name;$('winNote').hidden=s.mode!=='preset';
  var rv=$('reveal');rv.hidden=false;revealOpen=true;
  rv.querySelectorAll('.ring,.badge,.win-name').forEach(function(el){el.style.animation='none';el.offsetWidth;el.style.animation=''});
  $('next').focus();
}
function closeReveal(){
  if(!revealOpen)return;$('reveal').hidden=true;revealOpen=false;
  $('machine').classList.remove('win');s=load();spinning=false;render();$('spin').focus();
}
$('spin').addEventListener('click',spin);$('next').addEventListener('click',closeReveal);
document.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.key==='Enter'||e.key==='Escape'){
    if(revealOpen){e.preventDefault();closeReveal()}
    else if(e.code==='Space'&&!e.repeat){e.preventDefault();spin()}
  }
});
addEventListener('storage',function(e){if(e.key===KEY&&!spinning){s=load();render();idle()}});
render();idle();
console.assert(pick(['A','B','C'],'preset',['x','c'],Math.random)===2,'pick preset');
})();
</script>
</body>
